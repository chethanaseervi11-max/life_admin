<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="laGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#0f172a" />
  <!-- Inner card/shield -->
  <rect x="18" y="22" width="64" height="56" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <!-- Top bar of the card -->
  <rect x="18" y="22" width="64" height="14" rx="12" fill="#3b82f6" />
  <rect x="18" y="30" width="64" height="6" fill="#3b82f6" />
  <!-- Calendar binder pegs -->
  <rect x="32" y="16" width="6" height="10" rx="3" fill="#94a3b8" />
  <rect x="62" y="16" width="6" height="10" rx="3" fill="#94a3b8" />
  <!-- Radar pulse / clock dot -->
  <circle cx="50" cy="52" r="14" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="3 3" />
  <!-- Checkmark -->
  <path d="M42 52 L48 58 L58 46" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Urgency badge dot -->
  <circle cx="70" cy="38" r="4.5" fill="#f59e0b" />
</svg>
